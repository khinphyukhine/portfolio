const toggleChip = `<div class="chiprow"><button class="chip" data-toggle>▾ expand all</button></div>`;

/* ---------- adjustable terminal size ---------- */
const win = document.querySelector(".window");
let fullOn = false;
function setSize(w, h, full = false) {
  const maxW = window.innerWidth - 32, maxH = window.innerHeight - 32;
  w = Math.max(320, Math.min(w, maxW)); h = Math.max(300, Math.min(h, maxH));
  win.style.maxWidth = "none"; win.style.width = w + "px"; win.style.height = h + "px";
  fullOn = full;
}
function resetSize() { win.style.width = win.style.height = win.style.maxWidth = ""; fullOn = false; }
const goFull = () => setSize(1e5, 1e5, true);
document.getElementById("dotReset").addEventListener("click", resetSize);
document.getElementById("dotSmall").addEventListener("click", () => setSize(520, 460));
document.getElementById("dotFull").addEventListener("click", () => (fullOn ? resetSize() : goFull()));
const grip = document.getElementById("grip");
grip.addEventListener("pointerdown", e => {
  e.preventDefault(); grip.setPointerCapture(e.pointerId);
  const r = win.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
  // the window is centred, so it grows by 2x the drag distance to keep the corner under the pointer
  const move = ev => setSize(r.width + 2 * (ev.clientX - sx), r.height + 2 * (ev.clientY - sy));
  const up = () => { grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up); grip.removeEventListener("pointercancel", up); };
  grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up); grip.addEventListener("pointercancel", up);
});
window.addEventListener("resize", () => { if (fullOn) goFull(); else if (win.style.width) setSize(parseFloat(win.style.width), parseFloat(win.style.height)); });
commands.size = () => `<h3 class="sec">📐 terminal size</h3><div>drag the corner ◢ (bottom-right) to resize, or pick a preset:</div>` +
  chips([["size small", "small"], ["size large", "large"], ["size full", "fullscreen"], ["size reset", "reset"]]) +
  `<div class="dim">also: 🔴 resets · 🟡 compact · 🟢 fullscreen (the dots, top-left)</div>`;
const sized = (label, fn) => () => { fn(); return `<span class="lav">terminal size: ${label} 📐</span>`; };
commands["size small"] = sized("small", () => setSize(520, 460));
commands["size large"] = sized("large", () => setSize(1100, 860));
commands["size full"] = sized("fullscreen", goFull);
commands["size reset"] = commands["size medium"] = sized("default", resetSize);

const aliases = {
  "resume exp": "resume experience", "resume work": "resume experience",
  "resume edu": "resume education", "resume skill": "resume skills",
  "resume lead": "resume leadership", "resume everything": "resume all"
};
const names = Object.keys(commands).filter(n => !["ls", "whoami", "coffee"].includes(n));

function run(raw) {
  let cmd = raw.trim().toLowerCase().replace(/\s+/g, " ");
  if (!cmd) return;
  el(`<span class="prompt-text">~/khin 🌸 $</span> ${esc(raw)}`, "line echo");
  cmd = aliases[cmd] || cmd;
  trackCommand(cmd);
  if (cmd === "sudo hire-me") {
    el(`<span class="pink">🎉 permission granted!</span> <span class="dim">sending the offer letter to…</span> <a href="${esc(DATA.contact[0].href)}">${esc(DATA.contact[0].value)}</a> 😉`);
  } else if (commands[cmd]) {
    const out = commands[cmd]();
    if (out) initScenes(el(out));
  } else {
    el(`<span class="pink">command not found: ${esc(raw)} 🥺</span> <span class="dim">try 'help'</span>`);
  }
  history.push(raw); hIndex = history.length;
}

function commonPrefix(list) {
  return list.reduce((a, b) => { let i = 0; while (i < a.length && a[i] === b[i]) i++; return a.slice(0, i); });
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter") { run(input.value); input.value = ""; }
  else if (e.key === "ArrowUp") { if (hIndex > 0) input.value = history[--hIndex]; e.preventDefault(); }
  else if (e.key === "ArrowDown") { input.value = hIndex < history.length - 1 ? history[++hIndex] : (hIndex = history.length, ""); e.preventDefault(); }
  else if (e.key === "Tab") {
    e.preventDefault();
    const m = names.filter(n => n.startsWith(input.value.toLowerCase()));
    if (m.length) input.value = commonPrefix(m);
  }
});

screen.addEventListener("click", e => {
  const c = e.target.closest("[data-cmd]");
  if (c) { run(c.dataset.cmd); return; }
  const t = e.target.closest("[data-toggle]");
  if (t) {
    const ds = [...t.closest(".block").querySelectorAll("details")];
    const openThem = ds.some(d => !d.open);
    ds.forEach(d => d.open = openThem);
    t.textContent = openThem ? "▴ collapse all" : "▾ expand all";
    return;
  }
  if (e.target.closest("summary, a, button")) return;
  if (!getSelection().toString()) input.focus();
});

["about", "resume", "projects", "fun", "contact", "help", "theme", "clear"].forEach(c => {

    const x = x0 + k * 4 + Math.round(Math.sin(t * 3 + j * 0.9 + k * 2) * 1.2);
    const y = y0 - j * 2 - Math.floor(mod(t * 5, 2));
    r(x, y, 1, 2, `rgba(255,255,255,${(0.75 - j * 0.11).toFixed(2)})`);
  }
};

};
const liveScenes = []; let sceneTimer = null; const sceneStart = performance.now();
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function paint(s, t) {
  const g = s.g; g.imageSmoothingEnabled = false;
  const r = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
  try { SCENES[s.name](r, t); } catch (e) { /* unknown scene name: leave blank */ }
}
function initScenes(root) {
  root.querySelectorAll("canvas[data-scene]").forEach(c => {
    const s = { c, g: c.getContext("2d"), name: c.dataset.scene };
    liveScenes.push(s); paint(s, 0.4);
  });
  if (reduceMotion || sceneTimer) return;
  sceneTimer = setInterval(() => {
    const t = (performance.now() - sceneStart) / 1000;
    for (let i = liveScenes.length - 1; i >= 0; i--) {
      const s = liveScenes[i];
      if (!s.c.isConnected) { liveScenes.splice(i, 1); continue; }
      paint(s, t);
    }
  }, 90);
}

/* ---------- visitor stats (GoatCounter, only if a site code is set above) ---------- */
if (DATA.goatcounter) {
  const gc = document.createElement("script");
  gc.async = true; gc.src = "https://gc.zgo.at/count.js";
  gc.dataset.goatcounter = `https://${DATA.goatcounter}.goatcounter.com/count`;
  document.head.appendChild(gc);
}
function trackCommand(cmd) {   // shows up in your dashboard as e.g. "cmd/resume", so you can see what people open
  try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: "cmd/" + cmd, title: cmd, event: true }); } catch (e) {}
}

})();
